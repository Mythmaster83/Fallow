<title>Fallow Stake: the garden probe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(22,23,28,.86); --line:rgba(255,255,255,.08); --ink:#F2F1F6; --muted:#A3A2B3; --lime:#D7F26E; --dark:#16171C}
*{box-sizing:border-box}
html,body{margin:0; height:100%; background:radial-gradient(120% 90% at 55% 35%, #474a54 0%, #2c2e34 45%, #18191d 100%); color:var(--ink); font-family:'Plus Jakarta Sans',system-ui,sans-serif; overflow:hidden}
body.still{background:transparent}
#view{position:fixed; left:0; right:0; top:0; bottom:var(--dockh,150px)}
#view canvas{display:block; touch-action:none}
button{font:inherit; cursor:pointer}
.chip{position:fixed; left:18px; top:16px; z-index:5; display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 16px 6px 6px; backdrop-filter:blur(12px)}
.chip .mk{width:34px; height:34px; border-radius:11px; background:var(--lime); display:grid; place-items:center}
.chip b{font-size:15px} .chip span{font-size:13px; color:var(--muted); font-weight:600}
.dock{position:fixed; left:16px; right:16px; bottom:14px; background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:22px; padding:12px 14px; z-index:5; display:flex; flex-direction:column; gap:12px}
.row{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.seg{display:flex; gap:4px; background:rgba(255,255,255,.05); padding:4px; border-radius:999px}
.seg button{border:0; background:none; color:var(--muted); font-weight:800; font-size:14px; padding:9px 18px; border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--lime); color:var(--dark)}
.btn{border:0; border-radius:999px; min-height:40px; padding:0 18px; font-weight:800; font-size:14px}
.btn.primary{background:var(--lime); color:var(--dark)} .btn.ghost{background:rgba(255,255,255,.08); color:var(--ink)}
.tg{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; cursor:pointer}
.tg input{width:38px; height:22px; appearance:none; -webkit-appearance:none; background:#44464F; border-radius:11px; position:relative; cursor:pointer; margin:0}
.tg input::after{content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .2s}
.tg input:checked{background:#8DC63F} .tg input:checked::after{transform:translateX(16px)}
.sp{flex:1}
.sens{display:flex; gap:6px; flex-wrap:wrap}
.sens span{font-size:12.5px; font-weight:700; padding:6px 11px; border-radius:999px; background:rgba(255,255,255,.06); color:var(--muted); transition:all .3s}
.sens span.on{background:rgba(215,242,110,.16); color:var(--lime)}
.price{font-weight:800; font-size:22px} .price small{font-size:12px; color:var(--muted); margin-left:4px}
.labels{position:fixed; inset:0; pointer-events:none; z-index:4}
.lbl{position:absolute; transform:translate(-50%,-100%); display:flex; flex-direction:column; align-items:center; opacity:0; transition:opacity .25s}
.lbl span{background:var(--lime); color:var(--dark); font-size:12.5px; font-weight:800; padding:5px 11px; border-radius:999px; white-space:nowrap}
.lbl i{width:1px; height:18px; background:var(--lime)} .lbl em{width:7px; height:7px; border-radius:50%; background:var(--lime); margin-top:-1px}
.lbl.on{opacity:1}
.lbl.side{transform:translate(0,-50%)} .lbl.side.l{transform:translate(-100%,-50%)} .lbl.side i,.lbl.side em{display:none}
#lines{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:4}
#info{position:fixed; right:18px; top:16px; z-index:5; max-width:300px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:12px 14px; font-size:13px; line-height:1.5; color:var(--muted); display:none; backdrop-filter:blur(12px)}
#info b{color:var(--ink); display:block; font-size:14px}
body.still .dock, body.still .chip, body.still #info{display:none}
@media (max-width:720px){ .dock{left:8px; right:8px; bottom:8px} .seg button{padding:8px 12px} }
</style>

  parts.filter(p => p.tiers.includes(tier)).forEach(p => { const a = p.at(tier); const y = a[1] + p.ex[1] * exT + L; top = Math.max(top, y + p.top); bot = Math.min(bot, y); });
  if (!exT) bot = STILL ? -68 : -30;
  const ty = (top + bot) / 2 * MM, h = (top - bot) * MM;
  return { ty, d: Math.max(7.5, h * (exT ? 1.95 : 2.25)) };
}
function reframe() { const f = fit(); cam.fd = camera.position.distanceTo(controls.target); cam.td = f.d; cam.fy = controls.target.y; cam.ty = f.ty; cam.k = 0; cam.active = true; }
function resetView() { const f = fit(); controls.target.set(0, f.ty, 0); camera.position.copy(HOME.pos).normalize().multiplyScalar(f.d).add(controls.target); cam.active = false; }
document.getElementById("reset").addEventListener("click", resetView);
addEventListener("keydown", e => { if (e.key === "e" || e.key === "E") setExplode(exT ? 0 : 1); if (e.key === "1") setTier("lite"); if (e.key === "2") setTier("plus"); if (e.key === "3") setTier("pro"); });

/* picking for part info */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(parts.filter(p => p.scale > 0.5).map(p => p.group), true)[0];
  const info = document.getElementById("info");
  if (hit && hit.object.userData.part) { const p = hit.object.userData.part; info.innerHTML = `<b>${p.name}</b>${p.desc}`; info.style.display = "block"; }
  else info.style.display = "none";
});

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
function layout() { document.documentElement.style.setProperty("--dockh", STILL || EMBED ? "0px" : `${document.getElementById("dock").offsetHeight + 24}px`); resize(); }
addEventListener("resize", layout);

const clock = new THREE.Clock(), v3 = new THREE.Vector3();
function step(dt, now) {
  const k = 1 - Math.exp(-dt * 6);
  ex += (exT - ex) * k;
  lift += ((exT ? 1 : 0) * 50 - lift) * k;
  parts.forEach(p => {
    p.scale += (p.tgtScale - p.scale) * (1 - Math.exp(-dt * 8));
    const s = Math.max(0.0001, p.scale);
    p.group.scale.setScalar(s); p.group.visible = p.scale > 0.01;
    const a = p.at(tier);
    v3.set(a[0] + p.ex[0] * ex, a[1] + p.ex[1] * ex + lift, a[2] + p.ex[2] * ex);
    p.cur.lerp(v3, p.cur.lengthSq() ? k * 1.4 > 1 ? 1 : k * 1.4 : 1);
    p.group.position.copy(p.cur);
  });
  soil.position.y = -46 * ex;
  if (cam.active) { cam.k = Math.min(1, cam.k + dt * 1.4); const s = 1 - Math.pow(1 - cam.k, 3); const dir = camera.position.clone().sub(controls.target).normalize(); controls.target.y = cam.fy + (cam.ty - cam.fy) * s; camera.position.copy(controls.target).addScaledVector(dir, cam.fd + (cam.td - cam.fd) * s); if (cam.k >= 1) cam.active = false; }
  M.led.emissiveIntensity = 1.2 + 0.9 * (0.5 + 0.5 * Math.sin(now / 500));
  M.tubeGlow.emissiveIntensity = Math.random() < 0.08 ? 2.4 : 0.7;
}
const linesEl = document.getElementById("lines");
const LINE = EMBED ? "#6E9F2A" : "#D7F26E"; // lime leader lines vanish on a light page
function drawLabels() {
  const show = document.getElementById("lbls").checked && ex > 0.5;
  const w = view.clientWidth, h = view.clientHeight;
  let svg = "";
  const vis = parts.filter(p => show && p.scale > 0.6).sort((a, b) => b.cur.y - a.cur.y);
  parts.forEach(p => { if (!vis.includes(p)) p.label.classList.remove("on"); });
  v3.set(0, 0, 0).applyMatrix4(model.matrixWorld).project(camera);
  const cx = (v3.x * .5 + .5) * w;
  const lastY = { r: -1e9, l: -1e9 };
  vis.forEach((p, i) => {
    v3.set(0, p.top / 2, 0).add(p.cur).multiplyScalar(MM).project(camera);
    const ax = (v3.x * .5 + .5) * w, ay = (-v3.y * .5 + .5) * h;
    const side = i % 2 ? "l" : "r";
    let ly = Math.max(ay, lastY[side] + 34); lastY[side] = ly;
    const lx = side === "r" ? cx + Math.min(260, w * 0.2) : cx - Math.min(260, w * 0.2);
    p.label.classList.add("on", "side"); p.label.classList.toggle("l", side === "l");
    p.label.style.left = `${lx}px`; p.label.style.top = `${ly}px`;
    svg += `<path d="M${ax} ${ay} L${(ax + lx) / 2} ${ly} L${lx} ${ly}" stroke="${LINE}" stroke-width="1.5" fill="none" opacity=".85"/><circle cx="${ax}" cy="${ay}" r="3.5" fill="${LINE}"/>`;
  });
  linesEl.innerHTML = svg;
}
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  step(dt, performance.now());
  controls.update(); drawLabels();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
const embedExplode = EMBED ? exT : 0;
if (EMBED) exT = 0;
setTier(tier); setExplode(exT); layout();
parts.forEach(p => { p.scale = p.tgtScale; const a = p.at(tier); p.cur.set(a[0] + p.ex[0] * exT, a[1] + p.ex[1] * exT + (exT ? 50 : 0), a[2] + p.ex[2] * exT); });
ex = exT; lift = exT ? 50 : 0;
resetView();
if (STILL) {
  const yaw = +(Q.get("yaw") || 0.6), f = fit(), dist = f.d * +(Q.get("dist") || 1);
  controls.target.set(0, f.ty, 0);
  camera.position.set(Math.sin(yaw) * dist, f.ty + dist * 0.3, Math.cos(yaw) * dist);
  controls.update();
  for (let i = 0; i < 3; i++) step(0.016, 1000);
  renderer.render(scene, camera);
  window.__ready = true;
} else frame();
if (EMBED && embedExplode) {
  let timer = 0;
  const play = () => { clearTimeout(timer); setExplode(0); timer = setTimeout(() => setExplode(embedExplode), 900); };
  play();
  addEventListener("message", e => { if (e.data === "replay") play(); });
}
</script>
</body>
