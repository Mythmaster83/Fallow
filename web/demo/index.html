<style>
:root{
  --lav-bg:#BBA6F0; --panel:#F6F5F2; --card:#FFFFFF; --ink:#1C1C28; --muted:#6F6E7E; --line:#ECEBF0;
  --dark:#1E1E2A; --lime:#D7F26E; --lime-ink:#3F5A00; --green:#8DC63F;
  --t-peach:#FCE6DA; --t-lime:#EEF8CF; --t-lav:#E6E2FB; --t-cream:#FFF0D6; --t-red:#FDE0DC;
  --critical:#E5533F; --high:#E58A35; --medium:#C99A1E; --low:#7DB338;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif; background:var(--lav-bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; min-height:100vh}
button,input,select{font-family:inherit; font-size:inherit; color:inherit}
button{cursor:pointer}
a{color:inherit}
.ic{width:20px; height:20px; flex-shrink:0; display:inline-block; vertical-align:middle}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

/* top bar around the stage */
.bar{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; max-width:1180px; margin:0 auto; padding:20px 20px 8px}
.brand{display:flex; align-items:center; gap:14px; font-weight:800; font-size:28px; letter-spacing:-0.03em; color:var(--dark); line-height:1}
.brand .mk{width:50px; height:50px; border-radius:15px; background:var(--lime); color:var(--dark); display:flex; align-items:center; justify-content:center; padding:8px; box-shadow:0 8px 20px -10px rgba(30,20,80,.45)}
.logo{width:100%; height:100%; display:block}
.brand small{font-size:12px; font-weight:600; letter-spacing:0; color:#3D358F; background:#ffffff88; padding:4px 10px; border-radius:999px; margin-left:2px}
@media (max-width:700px){.brand{font-size:25px; gap:12px} .brand .mk{width:44px; height:44px; border-radius:13px; padding:7px}}
.seg{display:inline-flex; background:#ffffff88; border-radius:999px; padding:4px}
.seg button{border:0; background:transparent; padding:8px 14px; border-radius:999px; font-weight:700; font-size:13px; color:#3D358F; display:flex; align-items:center; gap:6px; min-height:36px}
.seg button[aria-pressed="true"]{background:var(--dark); color:#fff}
.barbtns{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.pillbtn{border:0; background:var(--dark); color:#fff; padding:10px 16px; border-radius:999px; font-weight:700; font-size:13px; display:inline-flex; align-items:center; gap:6px; min-height:40px}
.pillbtn.light{background:#ffffffaa; color:var(--dark)}

/* stage: phone frame or website panel */
.stage{display:flex; justify-content:center; padding:14px 16px 40px}
.device{width:390px; height:844px; border-radius:52px; background:var(--dark); padding:11px; box-shadow:0 40px 80px -40px rgba(40,20,100,.6); position:relative}
.device .screen{width:100%; height:100%; border-radius:42px; background:var(--panel); overflow:hidden; position:relative}
.device .scroll{height:100%; overflow-y:auto; padding:18px 16px 110px; scrollbar-width:none}
.device .scroll::-webkit-scrollbar{display:none}
.device .notch{position:absolute; top:10px; left:50%; transform:translateX(-50%); width:110px; height:28px; border-radius:20px; background:var(--dark); z-index:5}
.device .scroll{padding-top:52px}
.tabbar{position:absolute; left:10px; right:10px; bottom:10px; height:72px; background:var(--card); border-radius:30px; display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr)); align-items:center; box-shadow:0 10px 30px -12px rgba(40,20,100,.35); z-index:6}
.tabbar a{display:flex; flex-direction:column; align-items:center; gap:3px; text-decoration:none; font-size:10px; font-weight:700; color:var(--muted); padding:8px 0}
.tabbar a .bub{width:40px; height:30px; border-radius:15px; display:flex; align-items:center; justify-content:center}

.ach .lvlup{display:inline-block; margin-top:12px; font-size:12px; font-weight:800; color:var(--dark); background:var(--lime); padding:5px 12px; border-radius:999px}
.confetti{position:absolute; left:50%; top:30px; width:9px; height:14px; border-radius:2px; opacity:0}
.achwrap.out{animation:fadeout .4s ease-in forwards}
@keyframes fadeout{to{opacity:0; visibility:hidden}}
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(40px); opacity:0; visibility:hidden; background:var(--dark); color:#fff; padding:12px 18px; border-radius:999px; font-size:13px; font-weight:700; z-index:90; transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .25s, visibility .25s; display:flex; align-items:center; gap:8px}
.toast.show{transform:translateX(-50%) translateY(0); opacity:1; visibility:visible}
@media (max-width:700px){.toast{bottom:96px}}


/* watch */
.wstage{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; column-gap:48px; row-gap:40px; padding:100px 10px 40px; width:100%; max-width:1180px}
.wmain{padding:0 0 92px}
.watch{position:relative; width:300px; height:360px; flex-shrink:0}
.watch .band{position:absolute; left:50%; transform:translateX(-50%); width:190px; height:120px; background:#2B2B3B}
.watch .band.t{top:-92px; border-radius:30px 30px 0 0} .watch .band.b{bottom:-92px; border-radius:0 0 30px 30px}
.watch .case{position:absolute; inset:0; border-radius:76px; background:#14141C; padding:14px; box-shadow:0 40px 80px -30px rgba(30,20,80,.65), inset 0 0 0 2px #3A3A4C}
.watch .crown{position:absolute; right:-12px; top:92px; width:16px; height:52px; border-radius:7px; background:#3A3A4C; border:0; padding:0}
.watch .crown:hover{background:#4C4C60} .watch .side{position:absolute; right:-8px; top:170px; width:10px; height:62px; border-radius:5px; background:#2E2E3C; border:0; padding:0}
.wscreen{width:100%; height:100%; border-radius:62px; background:#000; color:#fff; overflow:hidden; position:relative; padding:24px 22px 30px; cursor:pointer; user-select:none}
.wtop{display:flex; justify-content:space-between; align-items:center; font-size:14px; font-weight:800}
.wtop .app{color:var(--lime); display:flex; align-items:center; gap:6px} .wtop .app .logo{width:18px; height:18px} .wtop .time{color:#fff}
.wbody{margin-top:12px}
.wk{font-size:13px; color:#9C9AAE; font-weight:700; display:flex; align-items:center; gap:6px}
.wk .ic{width:15px; height:15px}
.wbig{font-size:34px; font-weight:800; letter-spacing:-0.03em; line-height:1.05; margin-top:4px; text-transform:capitalize}
.wred{color:#FF8A7A; font-weight:800; font-size:16px; margin-top:4px} .wmut{color:#9C9AAE; font-size:13px; margin-top:6px; line-height:1.35}
.wbtn{position:absolute; left:22px; right:22px; bottom:34px; height:48px; border-radius:24px; border:0; background:var(--lime); color:#000; font-weight:800; font-size:16px; display:flex; align-items:center; justify-content:center; gap:6px}
.wbtn:active{transform:scale(.96)} .wbtn.done{background:#1F2A12; color:var(--lime)}
.wdots{position:absolute; bottom:14px; left:0; right:0; display:flex; justify-content:center; gap:5px}
.wdots i{width:6px; height:6px; border-radius:50%; background:#3A3A4C} .wdots i.on{background:#fff}
.wdeg{font-size:58px; font-weight:800; letter-spacing:-0.04em; line-height:1}
.wrow{display:flex; align-items:center; gap:8px; background:#16161F; border-radius:16px; padding:9px 11px; margin-top:8px; font-size:13px; font-weight:700}
.wrow .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0} .wrow .lab{color:#9C9AAE; width:46px; flex-shrink:0}
.dot.d-good{background:var(--green)} .dot.d-watch{background:#F2C14E} .dot.d-alert{background:#FF6B5B}
.wring{display:flex; align-items:center; gap:14px; margin-top:6px}
.wring .num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800; font-size:20px}
.wring .num small{font-size:10px; color:#9C9AAE; font-weight:700}
.wach{position:absolute; inset:0; background:rgba(0,0,0,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; z-index:3}
.wach .bb{width:84px; height:84px; border-radius:50%; background:var(--lime); color:#000; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 5px #000, 0 0 0 8px #D7F26E55}
.wach .bb .ic{width:40px; height:40px}
.wach .t1{font-size:11px; letter-spacing:.14em; color:var(--lime); font-weight:800; margin-top:14px; text-transform:uppercase}
.wach .t2{font-size:22px; font-weight:800; margin-top:4px} .wach .t3{font-size:14px; font-weight:800; color:var(--lime); margin-top:6px}
.wside{max-width:360px; display:flex; flex-direction:column; gap:14px}
.wside h2{margin:0; font-size:26px; letter-spacing:-0.02em} .wside p{margin:0; color:#3D358F; font-size:14px; line-height:1.5}
.wchips{display:flex; flex-wrap:wrap; gap:8px}
.wchips button{border:0; background:#ffffffaa; border-radius:999px; padding:9px 14px; font-weight:700; font-size:13px; color:var(--dark); min-height:40px}
.wchips button[aria-pressed="true"]{background:var(--dark); color:#fff}
.wthumbs{display:flex; flex-wrap:wrap; gap:16px; justify-content:center; flex-basis:100%}
.wthumb{width:120px; height:144px; border:0; padding:0; background:transparent; position:relative; overflow:hidden; border-radius:31px; cursor:pointer}
.wthumb .watch{position:absolute; top:0; left:0; transform:scale(.4); transform-origin:0 0; pointer-events:none}
.wthumb .watch .band{display:none}
.wthumb[aria-pressed="true"]{outline:3px solid var(--dark); outline-offset:3px}
@media (max-width:700px){.wstage{row-gap:10px; padding-top:96px} .wmain .watch{transform:scale(.95)} .wthumbs{display:none}}
@media (prefers-reduced-motion: no-preference){
  .wbody.enter{animation:slide .35s cubic-bezier(.2,.7,.2,1) both}
  .wach{animation:pop .4s ease-out both} .wach .bb{animation:spinin .7s cubic-bezier(.2,.8,.2,1) .1s both}
}
@keyframes slide{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
@keyframes grow{from{transform:scaleY(0)} to{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(.6); opacity:0} 70%{transform:scale(1.08)} 100%{transform:scale(1); opacity:1}}
@keyframes achin{0%{opacity:0; transform:translateY(-30px) scale(.8)} 60%{opacity:1; transform:translateY(4px) scale(1.04)} 100%{transform:none}}
@keyframes spinin{0%{transform:scale(0) rotate(-200deg)} 70%{transform:scale(1.15) rotate(10deg)} 100%{transform:scale(1) rotate(0)}}
@keyframes shine{0%{left:-60%} 100%{left:140%}}
@keyframes xpfill{from{width:var(--from)} to{width:var(--to)}}
@keyframes burst{0%{opacity:1; transform:translate(0,0) rotate(0)} 100%{opacity:0; transform:translate(var(--x),var(--y)) rotate(var(--r))}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(215,242,110,.8)} 100%{box-shadow:0 0 0 14px rgba(215,242,110,0)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 6px var(--dark), 0 0 0 9px #D7F26E55} 50%{box-shadow:0 0 0 6px var(--dark), 0 0 0 16px #D7F26E33}}
@keyframes flash{0%{background:var(--t-lime)} 100%{background:var(--card)}}
@media (prefers-reduced-motion: no-preference){
  .animate .a{animation:slide .55s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(var(--i,0) * 55ms)}
  .animate .chart .bar{transform-origin:bottom; animation:grow .7s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(200ms + var(--i,0) * 60ms)}
  .animate .feature .cta{animation:pop .45s ease-out .45s both}
  .ach{animation:achin .6s cubic-bezier(.2,.8,.2,1) both}
  .ach .badgebig{animation:spinin .8s cubic-bezier(.2,.8,.2,1) .15s both, glow 1.6s ease-in-out 1s infinite}
  .ach .shine{animation:shine 1.1s ease-in-out .8s both}
  .ach .bar span{animation:xpfill 1.2s cubic-bezier(.2,.7,.2,1) .7s both}
  .ach .lvlup{animation:pop .5s ease-out 1.8s both}
  .confetti{animation:burst 1.4s cubic-bezier(.15,.7,.3,1) both}
  .step.next .dot{animation:pulse 1.4s ease-out infinite}
  .r,.stat,.sensor{transition:transform .2s ease, box-shadow .2s ease}
  .r:hover,.stat:hover,.sensor:hover{transform:translateY(-2px); box-shadow:0 10px 24px -14px rgba(60,40,120,.35)}
  .group .r:hover{transform:none; box-shadow:none}
  .flash{animation:flash 1.2s ease-out}
}

  const rsBefore = risks(S.items), meal = plan(S.items, rsBefore)[idx]; if (!meal) return;
  const main = meal.ingredients[0], rMain = rsBefore.find(r => r.item_id === main.id);
  meal.ingredients.forEach(ing => { const it = S.items.find(i => i.id === ing.id); if (it) it.quantity = Math.max(0, Math.round((it.quantity - ing.amount)*1000)/1000); });
  const p = S.progress; p.meals += 1; let gained = 20; const ids = [];
  if (p.meals === 1) ids.push("first_rescue");
  if (rMain && rMain.days <= 0) { gained += 15; ids.push("last_minute"); }
  if (p.meals >= 3) ids.push("plan_complete");
  if (!risks(S.items).some(r => r.risk === "critical" || r.risk === "high")) { gained += 25; ids.push("zero_waste"); }
  render(false); award(`Cooked ${meal.name.toLowerCase()}`, gained, ids); toast(`Pantry updated: ${main.name} used up`);
}
function plantCrop(name) {
  const crop = advise(S.sensor).find(c => c.crop === name); if (!crop) return;
  const p = S.progress, gaps = nutrition(S.items, risks(S.items)).gaps; if (!p.planted.includes(crop.crop)) p.planted.push(crop.crop);
  let gained = 20; const ids = []; if (p.planted.length === 1) ids.push("green_thumb"); if (gaps.includes(crop.fills)) { gained += 10; ids.push("gap_closer"); }
  render(false); award(`Planted ${crop.crop}`, gained, ids);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act;
  if (act === "view") { S.view = t.dataset.v; try { localStorage.setItem("fallow-view", S.view); } catch (err) {} render(true); }
  else if (act === "reset") { S.items = sampleItems(); S.progress = freshProgress(); S.sensor = freshSensor(); S.filter = "all"; S.query = ""; S.formErr = ""; S.w = 0; closePop(); if (location.hash !== "#dashboard") location.hash = "dashboard"; else render(true); toast("Demo reset"); }
  else if (act === "drawer") openDrawer(true);
  else if (act === "drawer-close") openDrawer(false);
  else if (act === "preset") { S.sensor = PRESETS[t.dataset.p](); Object.keys(JITTER).forEach(k => { HIST[k] = Array.from({length:12}, () => S.sensor[k]); }); renderDrawer(); render(false); toast("Scenario loaded"); }
  else if (act === "frost") { S.sensor.frost = t.checked; render(false); }
  else if (act === "popclose") closePop();
  else if (act === "wnext") wGo(S.w + 1);
  else if (act === "wprev") wGo(S.w - 1);
  else if (act === "wgo") wGo(+t.dataset.i);
  else if (act === "wcook") cookMeal(0);
  else if (act === "wplant") plantCrop(t.dataset.crop);
  else if (act === "gosearch") { location.hash = "pantry"; setTimeout(() => document.getElementById("q")?.focus(), 80); }
  else if (act === "filter") { S.filter = t.dataset.v; render(false); }
  else if (act === "remove") { const it = S.items.find(i => i.id === t.dataset.id); S.items = S.items.filter(i => i.id !== t.dataset.id); render(false); toast(`Removed ${it ? it.name : "item"}`); }
  else if (act === "knows") { S.knows = t.checked; render(false); }
  else if (act === "badge") { const a = BY[t.dataset.id], info = document.getElementById("binfo"), on = S.progress.unlocked.includes(a.id);
    info.innerHTML = `<b>${esc(a.title)}</b>${on ? " · unlocked" : " · locked"}<br>${esc(a.desc)}`; info.classList.add("show"); }
  else if (act === "bar") { const rs = risks(S.items), r = rs[+t.dataset.i]; if (r) toast(`${cap(r.item_name)}: ${daysShort(r.days).toLowerCase()}, ${r.risk} risk`); }
  else if (act === "stepdone") { const key = t.dataset.key, j = +t.dataset.j, list = S.progress.cookedSteps[key] = S.progress.cookedSteps[key] || [];
    const at = list.indexOf(j); if (at >= 0) list.splice(at, 1); else list.push(j); t.classList.toggle("done"); }
  else if (act === "cook") cookMeal(+t.dataset.i);
  else if (act === "plant") plantCrop(t.dataset.crop);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.act === "slide") { const k = t.dataset.k; S.sensor[k] = +t.value; document.getElementById("o-" + k).textContent = `${fmtS(k, +t.value)} ${t.dataset.u}`;
    HIST[k] = (HIST[k] || []).concat(+t.value).slice(-24); LIVE[k] = +t.value; render(false); }
  else if (t.dataset.act === "query") { S.query = t.value; const pos = t.selectionStart; render(false); const q = document.getElementById("q"); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (err) {} } }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "addform") return; e.preventDefault();
  const f = new FormData(e.target), name = String(f.get("name") || "").trim(), unit = String(f.get("unit") || "").trim(), qty = parseFloat(f.get("quantity"));
  const acq = String(f.get("acquired") || iso(today())), exp = S.knows ? String(f.get("expires") || "") : null;
  if (!name) S.formErr = "Give the food a name.";
  else if (!(qty > 0)) S.formErr = "Quantity has to be greater than zero.";
  else if (!unit) S.formErr = "Give the quantity a unit, such as lb, bag or count.";
  else if (exp && exp < acq) S.formErr = "The expiry date can't be before the day you got it.";
  else {
    S.formErr = ""; const id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" + Math.random().toString(16).slice(2,6);
    S.items.push({id, name, category:String(f.get("category")), quantity:qty, unit, acquired_on:acq, expires_on:exp || null, location:String(f.get("location"))});
    S.lastAdded = id; render(false); toast(`Added ${name}`); return;
  }
  render(false); document.getElementById("f-name")?.focus();
});
document.addEventListener("keydown", e => {
  if (S.view === "watch" && !drawer.classList.contains("open") && (e.key === "ArrowRight" || e.key === "ArrowLeft") && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || "")) { wGo(S.w + (e.key === "ArrowRight" ? 1 : -1)); return; } if (e.key === "Escape") { if (drawer.classList.contains("open")) openDrawer(false); else closePop(); } });

route();
})();
</script>
