[project]
name = "fallow"
version = "0.1.0"
description = "Survival-grade kitchen and garden planner"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.6",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["larder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
