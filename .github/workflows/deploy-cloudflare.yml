# Builds the in-browser (stlite) copy of Fallow and publishes it to Cloudflare
# Workers as static files. Works on the free plan: no Python runs on Cloudflare.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy static site to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cloudflare-static

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          pip install -q -e ".[dev]"
          pytest -q

      - name: Build static site
        run: python deploy/build_static.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.162.0 deploy
