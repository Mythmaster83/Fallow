# Packages the Streamlit app and publishes it on every push to main.
# Cloudflare Workers Paid is required. Streamlit cannot boot inside the
# free plan's CPU limit, and the generated Worker config asks for that limit.
name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/cloudflare-autodeploy-3346

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check Cloudflare credentials
        env:
          SEC_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SEC_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEC_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SEC_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SEC_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          SEC_CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          VAR_CLOUDFLARE_API_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN }}
          VAR_CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VAR_CF_API_TOKEN: ${{ vars.CF_API_TOKEN }}
          VAR_CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          report() {
            if [ -n "$2" ]; then echo "$1: present"; else echo "$1: missing"; fi
          }
          report "secret CLOUDFLARE_API_TOKEN" "$SEC_CLOUDFLARE_API_TOKEN"
          report "secret CLOUDFLARE_ACCOUNT_ID" "$SEC_CLOUDFLARE_ACCOUNT_ID"
          report "secret CF_API_TOKEN" "$SEC_CF_API_TOKEN"
          report "secret CF_ACCOUNT_ID" "$SEC_CF_ACCOUNT_ID"
          report "secret CLOUDFLARE_TOKEN" "$SEC_CLOUDFLARE_TOKEN"
          report "secret CLOUDFLARE_API_KEY" "$SEC_CLOUDFLARE_API_KEY"
          report "variable CLOUDFLARE_API_TOKEN" "$VAR_CLOUDFLARE_API_TOKEN"
          report "variable CLOUDFLARE_ACCOUNT_ID" "$VAR_CLOUDFLARE_ACCOUNT_ID"
          report "variable CF_API_TOKEN" "$VAR_CF_API_TOKEN"
          report "variable CF_ACCOUNT_ID" "$VAR_CF_ACCOUNT_ID"
          token="${SEC_CLOUDFLARE_API_TOKEN:-${SEC_CF_API_TOKEN:-${SEC_CLOUDFLARE_TOKEN:-${SEC_CLOUDFLARE_API_KEY:-${VAR_CLOUDFLARE_API_TOKEN:-$VAR_CF_API_TOKEN}}}}}"
          account="${SEC_CLOUDFLARE_ACCOUNT_ID:-${SEC_CF_ACCOUNT_ID:-${VAR_CLOUDFLARE_ACCOUNT_ID:-$VAR_CF_ACCOUNT_ID}}}"
          if [ -z "$token" ] || [ -z "$account" ]; then
            echo "This job still cannot see a Cloudflare token and account ID."
            echo "Put them in Settings, Secrets and variables, Actions, under Repository secrets."
            exit 1
          fi
          {
            echo "CLOUDFLARE_API_TOKEN<<EOF"
            printf '%s\n' "$token"
            echo "EOF"
            echo "CLOUDFLARE_ACCOUNT_ID<<EOF"
            printf '%s\n' "$account"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Package the Streamlit app
        run: npx --yes @stlite/cloudflare@0.8.0 build "$GITHUB_WORKSPACE" -o /tmp/fallow-dist --entrypoint app.py --name fallow

      - name: Deploy
        working-directory: /tmp/fallow-dist
        run: npx --yes wrangler@4.162.0 deploy
