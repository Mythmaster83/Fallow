# Packages the Streamlit app and publishes it on every push to main.
# Cloudflare Workers Paid is required. Streamlit cannot boot inside the
# free plan's CPU limit, and the generated Worker config asks for that limit.
name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - cursor/cloudflare-autodeploy-3346

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing from this job."
            missing=1
          else
            echo "CLOUDFLARE_API_TOKEN is present."
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is missing from this job."
            missing=1
          else
            echo "CLOUDFLARE_ACCOUNT_ID is present."
          fi
          if [ "$missing" -ne 0 ]; then
            echo "The workflow reads repository Actions secrets with these exact names."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Package the Streamlit app
        run: npx --yes @stlite/cloudflare@0.8.0 build "$GITHUB_WORKSPACE" -o /tmp/fallow-dist --entrypoint app.py --name fallow

      - name: Deploy
        working-directory: /tmp/fallow-dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.162.0 deploy
